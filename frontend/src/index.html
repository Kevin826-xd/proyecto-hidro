<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servicios Hidroeléctricos Ñuble</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/auth.css" />
    <link rel="stylesheet" href="styles/catalog.css" />
    <link rel="stylesheet" href="styles/cart.css" />
    <link rel="stylesheet" href="styles/shipping.css" />
    <link rel="stylesheet" href="styles/admin.css" />
  </head>
  <body>
    <main class="container">
      <header class="topbar">
        <div>
          <h1><span class="title-blue">Servicios</span> <span class="title-yellow">Hidroeléctricos</span> <span class="title-green">Ñuble</span></h1>
        </div>

        <div class="header-actions">
          <button id="reloadBtn" class="button" type="button">Actualizar</button>
          <button id="cartBtn" class="button button-secondary" type="button">
            Carrito <span id="cartCount" class="cart-count">0</span>
          </button>
          <button id="shippingBtn" class="button button-secondary" type="button">Despacho</button>
          <button id="logoutBtn" class="button button-secondary hidden" type="button">Cerrar sesión</button>
        </div>
      </header>

      <section id="authPanel" class="auth-panel">
        <form id="loginForm" class="login-card">
          <h2>Iniciar sesión</h2>

          <label class="field">
            <span>Email</span>
            <input id="email" name="email" type="email" placeholder="correo@ejemplo.com" required />
          </label>

          <label class="field">
            <span>Contraseña</span>
            <input id="password" name="password" type="password" placeholder="••••••••" required />
          </label>

          <button class="button" type="submit">Entrar</button>
          <button id="showRegisterBtn" class="button button-secondary" type="button">Crear cuenta</button>
          <p id="loginAuthMessage" class="auth-message" aria-live="polite"></p>
        </form>

        <form id="registerForm" class="login-card hidden">
          <h2>Registrarse</h2>

          <label class="field">
            <span>Nombre</span>
            <input id="registerName" name="registerName" type="text" placeholder="Tu nombre" required />
          </label>

          <label class="field">
            <span>Email</span>
            <input id="registerEmail" name="registerEmail" type="email" placeholder="correo@ejemplo.com" required />
          </label>

          <label class="field">
            <span>Contraseña</span>
            <input id="registerPassword" name="registerPassword" type="password" placeholder="Min. 6 caracteres" required />
          </label>

          <button class="button" type="submit">Registrarse</button>
          <button id="showLoginBtn" class="button button-secondary" type="button">Ya tengo cuenta</button>
          <p id="registerAuthMessage" class="auth-message" aria-live="polite"></p>
        </form>
      </section>

      <section id="catalogWrapper" class="catalog-wrapper hidden">
        <section id="statusMessage" class="status-message" aria-live="polite"></section>

        <section id="adminPanel" class="admin-panel hidden" aria-label="Panel de administración">
          <div class="admin-header">
            <div>
              <p class="admin-eyebrow">Administrador</p>
              <h2>Gestión de la tienda</h2>
            </div>
            <span class="admin-badge">Acceso admin</span>
          </div>

          <section class="admin-section">
            <h3>Precios y stock</h3>
            <div id="adminProducts"></div>
          </section>

          <section class="admin-section">
            <h3>Todas las reservas</h3>
            <div id="adminReservations"></div>
          </section>
        </section>

        <nav id="categoriesContainer" class="categories" aria-label="Categorías de productos"></nav>

        <aside id="cartPanel" class="cart-panel hidden" aria-live="polite">
          <div class="cart-header">
            <h2>Carrito de compras</h2>
            <button id="closeCartBtn" class="button button-secondary small" type="button">Cerrar</button>
          </div>

          <div id="cartItemsList" class="cart-items-list"></div>

          <div class="cart-footer">
            <div class="cart-total-row">
              <span>Total</span>
              <strong id="cartTotal">$0</strong>
            </div>
          </div>
        </aside>

        <aside id="shippingPanel" class="shipping-panel hidden" aria-live="polite">
          <div class="cart-header">
            <h2>Opciones de despacho</h2>
            <button id="closeShippingBtn" class="button button-secondary small" type="button">Cerrar</button>
          </div>

          <div class="shipping-options">
            <button class="shipping-option active" type="button" data-method="pickup">
              <span class="shipping-option-header">
                <span>Retiro en tienda</span>
                <span>Gratis</span>
              </span>
              <small>Retira tu pedido en nuestra sucursal.</small>
            </button>
            <button class="shipping-option" type="button" data-method="home">
              <span class="shipping-option-header">
                <span>Despacho a domicilio</span>
                <span>$8.500</span>
              </span>
              <small>Entrega en Chillán y alrededores.</small>
            </button>
            <button class="shipping-option" type="button" data-method="express">
              <span class="shipping-option-header">
                <span>Despacho express</span>
                <span>$14.900</span>
              </span>
              <small>Entrega prioritaria en 24 horas.</small>
            </button>
          </div>

          <label id="shippingAddressField" class="field hidden">
            <span>Ciudad de entrega</span>
            <input id="shippingCity" type="text" placeholder="Ingresa la ciudad" />
            <span>Dirección de entrega</span>
            <input id="shippingAddress" type="text" placeholder="Ingresa tu dirección" />
          </label>

          <section class="calendar-shell" aria-label="Calendario para reservar despacho">
            <div class="calendar-toolbar">
              <button id="previousMonthBtn" class="calendar-nav" type="button" aria-label="Mes anterior">&lt;</button>
              <h3 id="calendarMonthLabel"></h3>
              <button id="nextMonthBtn" class="calendar-nav" type="button" aria-label="Mes siguiente">&gt;</button>
            </div>
            <div class="calendar-weekdays" aria-hidden="true">
              <span>Lun</span>
              <span>Mar</span>
              <span>Mié</span>
              <span>Jue</span>
              <span>Vie</span>
              <span>Sáb</span>
              <span>Dom</span>
            </div>
            <div id="calendarGrid" class="calendar-grid"></div>
            <p id="selectedDateLabel" class="selected-date-label">Selecciona un día disponible.</p>
            <input id="deliveryDate" type="hidden" />
          </section>

          <section class="reservation-history" aria-live="polite">
            <h3>Mis reservas</h3>
            <div id="reservationList" class="reservation-list"></div>
          </section>

          <button id="confirmShippingBtn" class="button" type="button">Reservar despacho</button>
        </aside>

        <section id="productsGrid" class="products-grid" aria-live="polite"></section>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
