services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hidro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hidro123}
      POSTGRES_DB: ${POSTGRES_DB:-hidrocenter}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Opcional: toma SMTP_*, ADMIN_*, etc. desde backend/.env si existe.
    env_file:
      - path: ./backend/.env
        required: false
    # Estas variables tienen prioridad sobre backend/.env.
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-hidro}:${POSTGRES_PASSWORD:-hidro123}@db:5432/${POSTGRES_DB:-hidrocenter}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
